<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prateek Mulye — Senior Full-Stack Engineer, backend-heavy">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11161D"/>
      <stop offset="1" stop-color="#0C1015"/>
    </linearGradient>
    <linearGradient id="champagne" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6C79C"/>
      <stop offset="1" stop-color="#D8B27E"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BD6A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5BD6A0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- console panel -->
  <rect x="1" y="1" width="1198" height="298" rx="16" fill="url(#panel)" stroke="#1E2730" stroke-width="1.5"/>

  <!-- title bar -->
  <circle cx="34" cy="34" r="5.5" fill="#2A3540"/>
  <circle cx="54" cy="34" r="5.5" fill="#2A3540"/>
  <circle cx="74" cy="34" r="5.5" fill="#2A3540"/>
  <text x="100" y="38" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#5C6B79">~/prateekmulye.dev — the console</text>

  <!-- name -->
  <text x="60" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="500" letter-spacing="-1" fill="#F4F1EC">Prateek Mulye</text>

  <!-- tagline -->
  <text x="62" y="190" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16.5" letter-spacing="0.5" fill="#9BA6B2">Senior Full-Stack Engineer<tspan fill="#3E4853"> · </tspan>backend-heavy<tspan fill="#3E4853"> · </tspan><tspan fill="url(#champagne)">distributed systems</tspan><tspan fill="#3E4853"> · </tspan>applied AI</text>

  <!-- thesis -->
  <text x="62" y="232" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#6E7B89">&#8220;Nothing fails silently. If I can&#8217;t see it fail, I haven&#8217;t finished building it.&#8221;</text>

  <!-- worldline motif: a pipeline that survives one incident -->
  <g transform="translate(60, 262)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1E2730" stroke-width="1.5"/>
    <polyline points="0,0 150,0 300,0 480,0 560,-14 640,0 820,0 980,0 1080,0" fill="none" stroke="url(#champagne)" stroke-width="2" stroke-opacity="0.85" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="3.5" fill="#74B3FF"/>
    <circle cx="300" cy="0" r="3.5" fill="#9BA6B2"/>
    <circle cx="560" cy="-14" r="20" fill="url(#bloom)"/>
    <circle cx="560" cy="-14" r="4.5" fill="#5BD6A0"/>
    <circle cx="820" cy="0" r="3.5" fill="#9BA6B2"/>
    <circle cx="1080" cy="0" r="4" fill="url(#champagne)"/>
  </g>

  <!-- right-side stat column -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">
    <text x="1140" y="92" font-size="30" fill="#F4F1EC">11+</text>
    <text x="1140" y="110" font-size="11" letter-spacing="1.5" fill="#5C6B79">YEARS</text>
    <text x="1140" y="150" font-size="30" fill="#F4F1EC">30M+</text>
    <text x="1140" y="168" font-size="11" letter-spacing="1.5" fill="#5C6B79">ROWS · POSTGRES</text>
    <text x="1140" y="208" font-size="30" fill="url(#champagne)">60%+</text>
    <text x="1140" y="226" font-size="11" letter-spacing="1.5" fill="#5C6B79">LATENCY CUT</text>
  </g>
</svg>
